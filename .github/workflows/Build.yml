name: .NET Core

on:
  push:
    branches-ignore:
     - 'release/*'
     - 'hotfix/*'
    pull_request:
     - opened
     - edited
     - synchronize
       
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: Find .net core version
      id: coreversion
      run: |
        cd src
        echo "Banana"
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: ${{ coreversion.version }}
    - name: Build with dotnet
      run: |
        cd src
        dotnet build --configuration Release
